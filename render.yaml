# Render Blueprint — one Node web service running the Next.js app.
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
#
# Riff has real accounts: SQLite at RIFF_DB_PATH, seeded from src/mocks/ on first boot.
# One instance only (SQLite is per-process) — do not scale this service horizontally.
#
# ┌─ LAUNCH BLOCKER (P0) ────────────────────────────────────────────────────────────────────┐
# │ ACCOUNT DATA DURABILITY. On `plan: free` there is no disk, so the app writes SQLite under   │
# │ the EPHEMERAL project directory — every deploy (and autoDeploy fires on every push) wipes   │
# │ ALL accounts, sessions, jams, messages and earned reputation. This is fine for a throwaway  │
# │ preview but is NOT shippable for real users.                                                │
# │                                                                                             │
# │ Before inviting anyone real, make this ONE change (a paid-plan/billing decision only you    │
# │ can make — the code path is already correct once a disk exists):                            │
# │   1. Set `plan:` to a paid tier that supports disks (e.g. `starter`).                        │
# │   2. Uncomment the `disk:` block below (mountPath /var/data).                                │
# │   3. Uncomment the RIFF_DB_PATH env var so the DB lives on the mount, not the ephemeral fs.  │
# │ Do NOT point RIFF_DB_PATH at /var/data WITHOUT the disk — that dir is read-only and the app  │
# │ would fall back to an ephemeral temp DB. Optionally set autoDeploy:false so pushes don't     │
# │ redeploy (and reseed) unattended.                                                           │
# └─────────────────────────────────────────────────────────────────────────────────────────────┘

services:
  - type: web
    name: riff-web
    runtime: node
    plan: free
    region: oregon

    # --include=dev is load-bearing. tailwindcss, postcss, autoprefixer and typescript are
    # devDependencies but are all required by `next build`. If NODE_ENV is ever set to
    # production on this service, a plain `npm ci` would omit them and the build would fail
    # with "Cannot find module 'tailwindcss'".
    buildCommand: npm ci --include=dev && npm run build

    # `next start -p ${PORT:-3000}` — Render injects PORT and the service must bind to it.
    startCommand: npm run start

    autoDeploy: true
    envVars:
      # Pin the runtime so a Render default bump cannot change the build under you.
      - key: NODE_VERSION
        value: "22"
      # Deliberately NOT setting NODE_ENV. `next build` always produces a production build and
      # `next start` always serves one, so the variable buys nothing and breaks `npm ci`.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Password recovery. Email delivery is wired (src/server/email.ts, Resend over fetch) but
      # OFF until RESEND_API_KEY is set below. Until then, RIFF_PREVIEW_RESET=1 returns the reset
      # code in the response so a preview user can self-recover — but ONLY after proving the
      # account's recovery email (a username alone never works). Once RESEND_API_KEY is set, the
      # code is EMAILED and never returned over HTTP (even with this flag on); delete this flag
      # for a real launch so there is no preview path at all.
      - key: RIFF_PREVIEW_RESET
        value: "1"
      # Wire real password-recovery email: add RESEND_API_KEY (from resend.com) and, once you have
      # a verified domain, RIFF_EMAIL_FROM. Set these as SECRET env vars in the Render dashboard
      # rather than committing the key here. With RESEND_API_KEY present, reset codes are emailed.
      # - key: RESEND_API_KEY
      #   sync: false            # set the value in the dashboard; never commit the key
      # - key: RIFF_EMAIL_FROM
      #   value: "Riff <no-reply@yourdomain.com>"
      # RIFF_DB_PATH is intentionally NOT set here. With no disk, db.ts defaults to
      # <project>/data/riff.db — writable on Render's ephemeral filesystem — and, as a last
      # resort, falls back to the OS temp dir. Both reset on deploy; that is the free-plan
      # trade-off. To persist, uncomment the disk AND the override below together.

    # Persist accounts across deploys (requires a paid plan). Uncomment BOTH the disk and the
    # RIFF_DB_PATH override so the database lives on the mounted volume:
    # disk:
    #   name: riff-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #   # and add this under envVars above:
    #   #   - key: RIFF_DB_PATH
    #   #     value: /var/data/riff.db
