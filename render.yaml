# Render Blueprint — one Node web service running the Next.js app, PROTOTYPE MODE.
#
# This configuration has ZERO external requirements: no disk, no secrets, no paid plan.
# It boots on any Render service. The trade-off is deliberate and loudly labelled:
# SQLite lives on the instance's ephemeral filesystem, so ALL data (accounts, jams,
# messages, votes) RESETS on every deploy or restart. That is the deal for a test
# prototype — fine for trying the app, not for real users.
#
# ── Graduating to a durable deployment later ────────────────────────────────────────────
#  1. Set `plan:` to a paid tier that supports disks (e.g. `starter`).
#  2. Add a disk:            disk: { name: riff-data, mountPath: /var/data, sizeGB: 1 }
#     (On an EXISTING service a Blueprint sync will NOT create the disk — add it in the
#     dashboard: service → Disks → Add Disk. Only brand-new Blueprint services get it
#     automatically.)
#  3. Add under envVars:     - key: RIFF_DB_PATH   value: /var/data/riff.db
#  4. Restore the boot refusal in src/server/db.ts and the process.exit(1) in
#     src/instrumentation.ts (both carry a "PROTOTYPE MODE" comment pointing here), so a
#     detached disk fails the deploy instead of silently serving an ephemeral database.
#  5. Optionally set autoDeploy: false so deploys are deliberate.
# ────────────────────────────────────────────────────────────────────────────────────────
#
# One instance only (SQLite is per-process) — do not scale this service horizontally.

services:
  - type: web
    name: riff-web
    runtime: node
    plan: free
    region: oregon

    # --include=dev is load-bearing. tailwindcss, postcss, autoprefixer and typescript are
    # devDependencies but are all required by `next build`. If NODE_ENV is ever set to
    # production on this service, a plain `npm ci` would omit them and the build would fail
    # with "Cannot find module 'tailwindcss'".
    buildCommand: npm ci --include=dev && npm run build

    # `next start -p ${PORT:-3000}` — Render injects PORT and the service must bind to it.
    startCommand: npm run start

    autoDeploy: true

    envVars:
      # Pin the runtime so a Render default bump cannot change the build under you.
      - key: NODE_VERSION
        value: "22"
      # Deliberately NOT setting NODE_ENV. `next build` always produces a production build and
      # `next start` always serves one, so the variable buys nothing and breaks `npm ci`.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # RIFF_DB_PATH is deliberately NOT set. Without it, db.ts writes SQLite under the
      # project directory (ephemeral on Render) and falls back to the OS temp dir if even
      # that is unwritable — the app always boots. If a stale RIFF_DB_PATH is still set on
      # the service from an earlier attempt, DELETE it in the dashboard (service →
      # Environment); with prototype-mode code it would only cause a harmless fallback
      # warning, but removing it keeps the logs clean.
      #
      # Password-recovery email stays off until RESEND_API_KEY is set (dashboard secret).
      # Reset codes are only ever delivered by email — never returned over HTTP.
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: RIFF_EMAIL_FROM
      #   value: "Riff <no-reply@yourdomain.com>"
