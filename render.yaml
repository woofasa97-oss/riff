# Render Blueprint — one Node web service running the Next.js app.
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
#
# Riff has real accounts: SQLite at RIFF_DB_PATH, seeded from src/mocks/ on first boot.
# One instance only (SQLite is per-process) — do not scale this service horizontally.
#
# Durability model:
#   plan: starter  → paid tier; required because the free tier has no persistent disks
#                    (and sleeps after idle). The disk below is what keeps accounts alive.
#   disk riff-data → mounted at /var/data; RIFF_DB_PATH points the SQLite file at it, so
#                    accounts, jams, messages and reputation survive every deploy.
#   Boot guard     → if RIFF_DB_PATH is set but unwritable (disk missing/detached), the app
#                    REFUSES to start (src/server/db.ts). The deploy fails and Render keeps
#                    the last healthy release serving — it never silently boots an ephemeral
#                    DB that would vanish on the next deploy.
#   autoDeploy: false → deploys are deliberate. Trigger them from the Render dashboard
#                    (Manual Deploy) rather than on every push.

services:
  - type: web
    name: riff-web
    runtime: node
    plan: starter
    region: oregon

    # --include=dev is load-bearing. tailwindcss, postcss, autoprefixer and typescript are
    # devDependencies but are all required by `next build`. If NODE_ENV is ever set to
    # production on this service, a plain `npm ci` would omit them and the build would fail
    # with "Cannot find module 'tailwindcss'".
    buildCommand: npm ci --include=dev && npm run build

    # `next start -p ${PORT:-3000}` — Render injects PORT and the service must bind to it.
    startCommand: npm run start

    autoDeploy: false

    disk:
      name: riff-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Pin the runtime so a Render default bump cannot change the build under you.
      - key: NODE_VERSION
        value: "22"
      # Deliberately NOT setting NODE_ENV. `next build` always produces a production build and
      # `next start` always serves one, so the variable buys nothing and breaks `npm ci`.
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # SQLite lives on the mounted disk so data survives deploys. If this path is ever
      # unwritable at boot (disk detached), the app throws instead of starting — see the
      # boot-guard note at the top of this file.
      - key: RIFF_DB_PATH
        value: /var/data/riff.db
      # Password-recovery email (Resend, src/server/email.ts). sync: false means the value is
      # a SECRET set in the Render dashboard — never committed here. Until it is set, reset
      # codes are issued but not delivered anywhere; with it set, they are emailed and never
      # returned over HTTP. Once you have a verified sending domain, also set RIFF_EMAIL_FROM
      # in the dashboard (e.g. "Riff <no-reply@yourdomain.com>").
      - key: RESEND_API_KEY
        sync: false
