<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Onboarding - Riff 3
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Lora:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      :root {
          --background: #F2EFF8;
          --foreground: #6B6880;
          --card: #FFFFFF;
          --card-foreground: #3D3C4F;
          --primary: #8A79AB;
          --primary-foreground: #FFFFFF;
          --secondary: #EFEBF6;
          --secondary-foreground: #3D3C4F;
          --muted: #F2EFF8;
          --muted-foreground: #6B6880;
          --accent: #EFEBF6;
          --accent-foreground: #8A79AB;
          --destructive: #DC2626;
          --destructive-foreground: #FFFFFF;
          --border: #E4DFEE;
          --input: #E4DFEE;
          --ring: #8A79AB;
          --font-sans: Geist;
          --font-serif: Lora;
          --font-mono: JetBrains Mono, monospace;
          --radius: 1rem;
          --shadow: -2px 4px 12px 4px rgba(51,51,51,0.05);
}
    </style>
  </head>
  <body class="bg-[#F8F7FA] text-foreground flex justify-center min-h-[100dvh]">
    <main class="w-full max-w-md bg-[#F8F7FA] flex flex-col relative h-[100dvh] shadow-xl overflow-hidden" id="app-container">
      <!-- Header -->
      <header id="header" class="w-full bg-[#F8F7FA] pt-14 pb-4 px-6 flex flex-col gap-4 z-10 sticky top-0">
        <div class="flex items-center justify-between w-full">
          <button class="w-10 h-10 flex items-center justify-center rounded-full text-foreground hover:bg-secondary transition-colors" aria-label="Go back">
                    <i class="text-lg"><i class="fa-solid fa-chevron-left"></i></i>
                </button>
                <span class="text-sm font-medium text-muted-foreground font-sans tracking-wide">Step 4 of 4</span>
          <div class="w-10 h-10">
          </div>
        </div>
        <!-- Progress Bar -->
        <div class="w-full h-1 bg-border rounded-full overflow-hidden">
          <div class="h-full bg-primary w-[95%] rounded-full transition-all duration-300">
          </div>
        </div>
      </header>
      <!-- Scrollable Content -->
      <div class="flex-1 overflow-y-auto px-6 pb-32 pt-2 flex flex-col items-center">
        <!-- Headline & Subline -->
        <div class="text-center mb-8 w-full">
          <h1 class="font-serif text-[28px] leading-tight font-bold text-card-foreground mb-3">
            Let them hear you
          </h1>
          <p class="font-sans text-[15px] text-muted-foreground leading-relaxed px-2">
            24 seconds is all it takes. Musicians with a clip get 3x more jam requests.
          </p>
        </div>
        <!-- Record Card -->
        <div class="w-full bg-card rounded-[16px] border border-border shadow-sm p-8 flex flex-col items-center justify-center relative overflow-hidden mb-6 min-h-[280px]">
          <!-- Timer -->
          <div class="font-serif text-3xl font-bold text-primary tracking-tight mb-8">
            0:18 / 0:24
          </div>
          <!-- Waveform (Soft Purple Graphic) -->
          <div class="w-full flex items-center justify-center gap-1 mb-10 h-12">
            <!-- Abstract representation of a waveform -->
            <div class="w-1.5 h-3 bg-primary/30 rounded-full">
            </div>
            <div class="w-1.5 h-6 bg-primary/40 rounded-full">
            </div>
            <div class="w-1.5 h-8 bg-primary/50 rounded-full">
            </div>
            <div class="w-1.5 h-12 bg-primary rounded-full">
            </div>
            <div class="w-1.5 h-10 bg-primary/80 rounded-full">
            </div>
            <div class="w-1.5 h-5 bg-primary/40 rounded-full">
            </div>
            <div class="w-1.5 h-8 bg-primary/60 rounded-full">
            </div>
            <div class="w-1.5 h-12 bg-primary rounded-full">
            </div>
            <div class="w-1.5 h-6 bg-primary/40 rounded-full">
            </div>
            <div class="w-1.5 h-4 bg-primary/30 rounded-full">
            </div>
            <div class="w-1.5 h-7 bg-primary/50 rounded-full">
            </div>
            <div class="w-1.5 h-3 bg-primary/30 rounded-full">
            </div>
          </div>
          <!-- Record Button with Halo -->
          <div class="relative flex flex-col items-center justify-center mb-2">
            <div class="absolute w-24 h-24 bg-primary/20 rounded-full animate-pulse">
            </div>
            <button class="relative z-10 w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-95">
            <div class="w-5 h-5 bg-white rounded-sm">
            </div>
            </button>
          </div>
          <!-- Recording Label -->
                <span class="text-[10px] uppercase tracking-[0.1em] font-bold text-primary mt-4">RECORDING</span>
        </div>
        <!-- Action Buttons Row -->
        <div class="w-full flex justify-center gap-6 mb-8">
          <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-full border border-border bg-card flex items-center justify-center text-foreground group-hover:border-primary/50 transition-colors shadow-sm">
            <i><i class="fa-solid fa-rotate-right"></i></i>
          </div>
          <span class="text-xs font-sans text-muted-foreground font-medium">Re-record</span>
                </button>

                <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-full border border-border bg-card flex items-center justify-center text-foreground group-hover:border-primary/50 transition-colors shadow-sm">
            <i><i class="fa-solid fa-play"></i></i>
          </div>
          <span class="text-xs font-sans text-muted-foreground font-medium">Play back</span>
                </button>

                <button class="flex flex-col items-center gap-2 group">
          <div class="w-12 h-12 rounded-full border border-border bg-card flex items-center justify-center text-foreground group-hover:border-primary/50 transition-colors shadow-sm">
            <i><i class="fa-solid fa-scissors"></i></i>
          </div>
          <span class="text-xs font-sans text-muted-foreground font-medium">Trim</span>
                </button>
        </div>
        <!-- Info Card -->
        <div class="w-full bg-[#EFEBF6] rounded-[16px] p-5 flex gap-4 items-start shadow-sm border border-transparent">
          <div class="text-primary mt-0.5">
            <i class="text-lg"><i class="fa-solid fa-lightbulb"></i></i>
          </div>
          <div class="flex flex-col gap-1">
            <h3 class="font-sans font-bold text-card-foreground text-sm">
              Pick something loose.
            </h3>
            <p class="font-sans text-sm text-foreground leading-relaxed">
              A groove, a riff, a few bars. Nobody is auditioning.
            </p>
          </div>
        </div>
      </div>
      <!-- Sticky Bottom Bar -->
      <div class="absolute bottom-0 left-0 w-full bg-[#F8F7FA] border-t border-border px-6 py-6 pb-8 z-20 flex items-center justify-between">
        <button class="text-muted-foreground font-sans font-medium text-[15px] hover:text-foreground transition-colors px-2">
                Skip for now
            </button>
            <button class="bg-primary text-primary-foreground font-semibold px-6 py-3.5 rounded-[12px] shadow-sm hover:opacity-90 transition-opacity font-sans text-base">
                Save clip and finish
            </button>
      </div>
    </main>
  </body>
</html>
