<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest"};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Live - Riff
    </title>
    <style>
      :root {
          --background: #f8f7fa;
          --foreground: #3d3c4f;
          --card: #ffffff;
          --card-foreground: #3d3c4f;
          --popover: #ffffff;
          --popover-foreground: #3d3c4f;
          --primary: #8a79ab;
          --primary-foreground: #f8f7fa;
          --secondary: #dfd9ec;
          --secondary-foreground: #3d3c4f;
          --muted: #dcd9e3;
          --muted-foreground: #6b6880;
          --accent: #e6a5b8;
          --accent-foreground: #4b2e36;
          --destructive: #d95c5c;
          --destructive-foreground: #f8f7fa;
          --border: #cec9d9;
          --input: #eae7f0;
          --ring: #8a79ab;
          --chart-1: #8a79ab;
          --chart-2: #e6a5b8;
          --chart-3: #77b8a1;
          --chart-4: #f0c88d;
          --chart-5: #a0bbe3;
          --sidebar: #f1eff5;
          --sidebar-foreground: #3d3c4f;
          --sidebar-primary: #8a79ab;
          --sidebar-primary-foreground: #f8f7fa;
          --sidebar-accent: #e6a5b8;
          --sidebar-accent-foreground: #4b2e36;
          --sidebar-border: #d7d2e0;
          --sidebar-ring: #8a79ab;
          --font-sans: Geist, sans-serif;
          --font-serif: "Lora", Georgia, serif;
          --font-mono: "Fira Code", "Courier New", monospace;
          --radius: 0.5rem;
          --shadow-x: 1px;
          --shadow-y: 2px;
          --shadow-blur: 5px;
          --shadow-spread: 1px;
          --shadow-opacity: 0.06;
          --shadow-color: hsl(0 0% 0%);
          --shadow-2xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-sm: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow-md: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 2px 4px 0px hsl(0 0% 0% / 0.06);
          --shadow-lg: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 4px 6px 0px hsl(0 0% 0% / 0.06);
          --shadow-xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 8px 10px 0px hsl(0 0% 0% / 0.06);
          --shadow-2xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.15);
          --tracking-normal: 0em;
          --spacing: 0.25rem;
}
    </style>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
  </head>
  <body class="m-0 p-0 min-h-[100dvh] flex flex-col w-full max-w-md mx-auto relative overflow-hidden bg-black text-white">
    <!-- Background Image -->
    <div class="absolute inset-0 z-0">
      <div class="w-full h-full overflow-hidden bg-[#110e17]">
        <img class="w-full h-full object-cover opacity-70 mix-blend-screen" src="https://images.unsplash.com/photo-1516280440502-a2f0b7f8c094?q=80&amp;w=1000&amp;auto=format&amp;fit=crop" alt="Live performance washed in blue and magenta">
      </div>
      <!-- Gradients -->
      <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none">
      </div>
    </div>
    <!-- Header -->
    <header class="h-[56px] px-4 flex items-center justify-between z-10 relative mt-safe">
      <h1 class="font-serif font-bold text-[22px] text-white tracking-wide">
        Riff
      </h1>
      <div class="flex items-center gap-3">
        <button class="w-[36px] h-[36px] rounded-full flex items-center justify-center bg-white/12 text-white backdrop-blur-md" aria-label="Share">
                <i class="text-[16px]"><i class="fa-solid fa-arrow-up-from-bracket"></i></i>
            </button>
            <button class="w-[36px] h-[36px] rounded-full flex items-center justify-center bg-white/12 text-white backdrop-blur-md" aria-label="Close">
                <i class="text-[18px]"><i class="fa-solid fa-xmark"></i></i>
            </button>
      </div>
    </header>
    <!-- Main Content Area (Flexible) -->
    <main class="flex-1 relative z-10 flex flex-col justify-between px-4 pb-[100px]">
      <!-- Top Info Section -->
      <div class="mt-4 flex items-start justify-between">
        <div class="flex flex-col gap-3">
          <!-- User Info -->
          <div class="flex items-center gap-3">
            <div class="relative">
              <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Lunar Resonance" class="w-12 h-12 rounded-full border-2 border-white/20 object-cover">
              <div class="absolute -bottom-1 -right-1 bg-[#E5262F] text-white text-[8px] font-bold px-1.5 py-0.5 rounded-sm uppercase tracking-wider border border-black">
                LIVE
              </div>
            </div>
            <div>
              <h2 class="font-serif font-bold text-[18px] text-white leading-tight">
                Lunar Resonance
              </h2>
              <div class="flex items-center gap-1.5 mt-0.5">
                <i class="text-[10px] text-white/70"><i class="fa-regular fa-eye"></i></i>
                            <span class="font-sans text-[12px] text-white/70">8.4k watching</span>
              </div>
            </div>
          </div>
          <!-- Pills -->
          <div class="flex flex-col gap-2 items-start mt-2">
            <div class="bg-black/40 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-2 border border-white/10">
              <i class="text-[#FACC15] text-[12px]"><i class="fa-solid fa-star"></i></i>
                        <span class="font-sans font-bold text-white text-[13px]">4.9</span>
                        <span class="font-sans text-white/60 text-[11px] uppercase tracking-wide">Session rating</span>
            </div>
            <div class="bg-black/40 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-2 border border-white/10">
              <i class="text-[#8a79ab] text-[12px]"><i class="fa-solid fa-bolt"></i></i>
                        <span class="font-sans font-bold text-white text-[13px]">Legendary</span>
                        <span class="font-sans text-white/60 text-[11px] uppercase tracking-wide">Reputation</span>
            </div>
          </div>
        </div>
        <button class="px-4 py-1.5 rounded-full border border-white text-white font-sans text-[13px] font-semibold hover:bg-white/10 transition-colors">
                Follow
            </button>
      </div>
      <!-- Bottom Chat & Actions Section -->
      <div class="flex flex-col gap-4">
        <!-- Chat Rail -->
        <div class="flex flex-col gap-3 justify-end mask-image:linear-gradient(to_bottom,transparent,black_20%) pt-8">
          <!-- Chat Message 1 -->
          <div class="flex items-start gap-2.5">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-7 h-7 rounded-full object-cover">
            <div class="flex flex-col">
              <span class="font-sans text-[11px] text-white/60 font-medium">@jamsesh99</span>
                        <span class="font-sans text-[14px] text-white leading-tight">That transition was smooth 🎸</span>
            </div>
          </div>
          <!-- Chat Message 2 -->
          <div class="flex items-start gap-2.5">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" class="w-7 h-7 rounded-full object-cover">
            <div class="flex flex-col">
              <span class="font-sans text-[11px] text-white/60 font-medium">@marcusc</span>
                        <span class="font-sans text-[14px] text-white leading-tight">Drop the tone presets!</span>
            </div>
          </div>
          <!-- Chat Message 3 -->
          <div class="flex items-start gap-2.5">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-8.jpg" class="w-7 h-7 rounded-full object-cover">
            <div class="flex flex-col">
              <span class="font-sans text-[11px] text-white/60 font-medium">@sarahbass</span>
                        <span class="font-sans text-[14px] text-white leading-tight">Pocket is crazy right now 🔥</span>
            </div>
          </div>
          <!-- Chat Message 4 -->
          <div class="flex items-start gap-2.5">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-6.jpg" class="w-7 h-7 rounded-full object-cover">
            <div class="flex flex-col">
              <span class="font-sans text-[11px] text-white/60 font-medium">@neo_echoes</span>
                        <span class="font-sans text-[14px] text-white leading-tight">Brooklyn stand up!</span>
            </div>
          </div>
        </div>
        <!-- Composer Row -->
        <div class="flex items-center gap-3 w-full">
          <div class="flex-1 bg-white/10 backdrop-blur-md rounded-full px-4 py-3 flex items-center border border-white/10">
            <input type="text" placeholder="Add a comment…" class="bg-transparent border-none outline-none text-white font-sans text-[14px] w-full placeholder:text-white/50">
          </div>
          <button class="w-[44px] h-[44px] rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center border border-white/10 flex-shrink-0">
                    <i class="text-[#FACC15] text-[18px]"><i class="fa-solid fa-star"></i></i>
                </button>
                <button class="w-[44px] h-[44px] rounded-full bg-[#8a79ab] flex items-center justify-center flex-shrink-0">
                    <i class="text-white text-[18px]"><i class="fa-solid fa-heart"></i></i>
                </button>
        </div>
      </div>
    </main>
    <!-- Bottom Tab Bar (Dark Version) -->
    <nav class="fixed bottom-0 w-full max-w-md bg-black/90 backdrop-blur-md border-t border-white/10 h-[76px] pb-5 pt-2 px-6 flex justify-between items-center z-40">
      <!-- Map -->
        <a href="#" class="flex flex-col items-center justify-center w-12 text-[#9C97A9]">
            <i class="text-[22px] mb-1"><i class="fa-solid fa-map-location-dot"></i></i>
            <span class="text-[10.5px] font-sans font-medium">Map</span>
        </a>
        <!-- Discover -->
        <a href="#" class="flex flex-col items-center justify-center w-12 text-[#9C97A9]">
            <i class="text-[22px] mb-1"><i class="fa-regular fa-compass"></i></i>
            <span class="text-[10.5px] font-sans font-medium">Discover</span>
        </a>
        <!-- Jams -->
        <a href="#" class="flex flex-col items-center justify-center w-12 text-[#9C97A9]">
            <i class="text-[22px] mb-1"><i class="fa-solid fa-guitar"></i></i>
            <span class="text-[10.5px] font-sans font-medium">Jams</span>
        </a>
        <!-- Live (Active) -->
        <a href="#" class="flex flex-col items-center justify-center w-12 text-white relative">
      <div class="absolute -top-0.5 right-2 w-2 h-2 rounded-full bg-[#E6A5B8]">
      </div>
      <i class="text-[22px] mb-1"><i class="fa-solid fa-tower-broadcast"></i></i>
            <span class="text-[10.5px] font-sans font-semibold">Live</span>
        </a>
        <!-- Me -->
        <a href="#" class="flex flex-col items-center justify-center w-12 text-[#9C97A9]">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Me" class="w-6 h-6 rounded-full border border-[#9C97A9] mb-1 object-cover opacity-70">
            <span class="text-[10.5px] font-sans font-medium">Me</span>
        </a>
    </nav>
  </body>
</html>
