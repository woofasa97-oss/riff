<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>
      Welcome - Riff
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <style>
      :root {
          --background: #f8f7fa;
          --foreground: #3d3c4f;
          --card: #ffffff;
          --card-foreground: #3d3c4f;
          --popover: #ffffff;
          --popover-foreground: #3d3c4f;
          --primary: #8a79ab;
          --primary-foreground: #f8f7fa;
          --secondary: #dfd9ec;
          --secondary-foreground: #3d3c4f;
          --muted: #dcd9e3;
          --muted-foreground: #6b6880;
          --accent: #e6a5b8;
          --accent-foreground: #4b2e36;
          --destructive: #d95c5c;
          --destructive-foreground: #f8f7fa;
          --border: #cec9d9;
          --input: #eae7f0;
          --ring: #8a79ab;
          --chart-1: #8a79ab;
          --chart-2: #e6a5b8;
          --chart-3: #77b8a1;
          --chart-4: #f0c88d;
          --chart-5: #a0bbe3;
          --sidebar: #f1eff5;
          --sidebar-foreground: #3d3c4f;
          --sidebar-primary: #8a79ab;
          --sidebar-primary-foreground: #f8f7fa;
          --sidebar-accent: #e6a5b8;
          --sidebar-accent-foreground: #4b2e36;
          --sidebar-border: #d7d2e0;
          --sidebar-ring: #8a79ab;
          --font-sans: Geist, sans-serif;
          --font-serif: "Lora", Georgia, serif;
          --font-mono: "Fira Code", "Courier New", monospace;
          --radius: 0.5rem;
          --shadow-x: 1px;
          --shadow-y: 2px;
          --shadow-blur: 5px;
          --shadow-spread: 1px;
          --shadow-opacity: 0.06;
          --shadow-color: hsl(0 0% 0%);
          --shadow-2xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-sm: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow-md: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 2px 4px 0px hsl(0 0% 0% / 0.06);
          --shadow-lg: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 4px 6px 0px hsl(0 0% 0% / 0.06);
          --shadow-xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 8px 10px 0px hsl(0 0% 0% / 0.06);
          --shadow-2xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.15);
          --tracking-normal: 0em;
          --spacing: 0.25rem;
}
    </style>
  </head>
  <body class="h-full w-full overflow-hidden flex flex-col items-center justify-center m-0 p-0">
    <!-- Main Container -->
    <main id="welcome-screen" class="relative w-full h-full max-w-md mx-auto flex flex-col justify-between overflow-hidden sm:shadow-2xl sm:border sm:border-[#333] sm:rounded-3xl sm:h-[844px] sm:my-auto">
      <!-- Background Image -->
      <div class="absolute inset-0 z-0">
        <img class="w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_d33547cbbe_314753c0c168bc3e.png" alt="dim rehearsal room washed in purple light, drum kit and amps barely visible in the shadows, cinemati">
      </div>
      <!-- Gradient Overlay -->
      <div class="absolute inset-0 z-10 hero-gradient">
      </div>
      <!-- Top Content -->
      <div class="relative z-20 flex flex-col items-center pt-20 px-6">
        <h1 class="font-serif text-5xl font-bold text-white tracking-tight mb-3 drop-shadow-md">
          Riff
        </h1>
        <p class="text-white text-lg font-medium tracking-wide drop-shadow text-center">
          Find your people. Play tonight.
        </p>
      </div>
      <!-- Bottom Actions -->
      <div class="relative z-20 flex flex-col px-6 pb-10 sm:pb-12 w-full gap-3 mt-auto">
        <button class="w-full h-12 bg-[#8A79AB] hover:bg-[#796996] active:bg-[#685a81] text-white rounded-xl font-semibold text-[15px] transition-colors flex items-center justify-center">
                Create your player card
            </button>

            <button class="w-full h-12 bg-white hover:bg-gray-100 active:bg-gray-200 text-[#3D3C4F] rounded-xl font-semibold text-[15px] transition-colors flex items-center justify-center gap-2">
                <i class="text-xl"><i class="fa-brands fa-apple"></i></i>
                Continue with Apple
            </button>

            <button class="w-full h-12 bg-white hover:bg-gray-100 active:bg-gray-200 text-[#3D3C4F] rounded-xl font-semibold text-[15px] transition-colors flex items-center justify-center gap-2">
                <svg viewBox="0 0 24 24" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                </svg>
                Continue with Google
            </button>

            <button class="w-full py-4 mt-2 text-white font-medium text-[15px] hover:text-gray-200 transition-colors">
                I already have an account
            </button>
        <div class="mt-4 text-center px-4">
          <p class="text-[11px] text-white/60 leading-tight">
            Riff shows you musicians near you. You choose who sees you.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
