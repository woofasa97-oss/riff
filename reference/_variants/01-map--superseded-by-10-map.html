<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>
      Map - Riff
    </title>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <style>
      :root {
          --background: #f8f7fa;
          --foreground: #3d3c4f;
          --card: #ffffff;
          --card-foreground: #3d3c4f;
          --popover: #ffffff;
          --popover-foreground: #3d3c4f;
          --primary: #8a79ab;
          --primary-foreground: #f8f7fa;
          --secondary: #dfd9ec;
          --secondary-foreground: #3d3c4f;
          --muted: #dcd9e3;
          --muted-foreground: #6b6880;
          --accent: #e6a5b8;
          --accent-foreground: #4b2e36;
          --destructive: #d95c5c;
          --destructive-foreground: #f8f7fa;
          --border: #cec9d9;
          --input: #eae7f0;
          --ring: #8a79ab;
          --chart-1: #8a79ab;
          --chart-2: #e6a5b8;
          --chart-3: #77b8a1;
          --chart-4: #f0c88d;
          --chart-5: #a0bbe3;
          --sidebar: #f1eff5;
          --sidebar-foreground: #3d3c4f;
          --sidebar-primary: #8a79ab;
          --sidebar-primary-foreground: #f8f7fa;
          --sidebar-accent: #e6a5b8;
          --sidebar-accent-foreground: #4b2e36;
          --sidebar-border: #d7d2e0;
          --sidebar-ring: #8a79ab;
          --font-sans: Geist, sans-serif;
          --font-serif: "Lora", Georgia, serif;
          --font-mono: "Fira Code", "Courier New", monospace;
          --radius: 0.5rem;
          --shadow-x: 1px;
          --shadow-y: 2px;
          --shadow-blur: 5px;
          --shadow-spread: 1px;
          --shadow-opacity: 0.06;
          --shadow-color: hsl(0 0% 0%);
          --shadow-2xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-sm: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow-md: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 2px 4px 0px hsl(0 0% 0% / 0.06);
          --shadow-lg: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 4px 6px 0px hsl(0 0% 0% / 0.06);
          --shadow-xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 8px 10px 0px hsl(0 0% 0% / 0.06);
          --shadow-2xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.15);
          --tracking-normal: 0em;
          --spacing: 0.25rem;
}
    </style>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
  </head>
  <body class="h-full w-full overflow-hidden flex flex-col items-center justify-center m-0 p-0 bg-background">
    <!-- Main Container - Mobile Constrained -->
    <main id="map-screen" class="relative w-full h-full max-w-md mx-auto flex flex-col bg-background overflow-hidden sm:shadow-2xl sm:border sm:border-border sm:rounded-[32px] sm:h-[844px] sm:my-auto">
      <!-- HEADER -->
      <header id="top-header" class="w-full h-[56px] flex items-center justify-between px-4 bg-background z-20 shrink-0">
        <div class="font-serif font-bold text-[22px] text-primary">
          Riff
        </div>
        <div class="flex gap-2">
          <button class="w-[36px] h-[36px] rounded-full bg-white border border-border flex items-center justify-center text-foreground hover:bg-gray-50 active:bg-gray-100 transition-colors" aria-label="Search">
                    <i class="font-light text-[14px]"><i class="fa-solid fa-magnifying-glass"></i></i>
                </button>
                <button class="w-[36px] h-[36px] rounded-full bg-white border border-border flex items-center justify-center text-foreground hover:bg-gray-50 active:bg-gray-100 transition-colors" aria-label="Filter">
                    <i class="font-light text-[14px]"><i class="fa-solid fa-sliders"></i></i>
                </button>
        </div>
      </header>
      <!-- FILTERS -->
      <div id="filters" class="w-full overflow-x-auto hide-scrollbar bg-background z-20 pb-3 pt-1 shrink-0">
        <div class="flex px-4 gap-2 min-w-max">
          <button class="px-4 py-1.5 rounded-full bg-primary text-white text-[13px] font-medium border border-primary whitespace-nowrap">Tonight</button>
                <button class="px-4 py-1.5 rounded-full bg-white text-foreground text-[13px] font-medium border border-border whitespace-nowrap">All musicians</button>
                <button class="px-4 py-1.5 rounded-full bg-white text-foreground text-[13px] font-medium border border-border whitespace-nowrap">Bass</button>
                <button class="px-4 py-1.5 rounded-full bg-white text-foreground text-[13px] font-medium border border-border whitespace-nowrap">Drums</button>
                <button class="px-4 py-1.5 rounded-full bg-white text-foreground text-[13px] font-medium border border-border whitespace-nowrap">Keys</button>
        </div>
      </div>
      <!-- MAP AREA -->
      <div id="map-area" class="relative flex-1 w-full bg-[#f4f2f8] map-bg z-0 overflow-hidden">
        <!-- Map overlay gradient for depth -->
        <div class="absolute inset-0 bg-gradient-to-b from-background/30 to-transparent pointer-events-none">
        </div>
        <!-- Williamsburg Area Pin -->
        <div class="absolute top-[15%] left-[10%] transform -translate-x-1/2 flex flex-col items-center">
          <div class="bg-white rounded-[16px] border border-border p-3 shadow-sm flex flex-col items-center gap-2 relative z-10 w-[140px]">
            <span class="font-serif font-semibold text-foreground text-[15px]">Williamsburg</span>
            <div class="flex -space-x-2">
              <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" class="w-8 h-8 rounded-full border-2 border-white object-cover" alt="Musician">
                        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-8 h-8 rounded-full border-2 border-white object-cover" alt="Musician">
                        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-8 h-8 rounded-full border-2 border-white object-cover" alt="Musician">
              <div class="w-8 h-8 rounded-full border-2 border-white bg-gray-100 flex items-center justify-center text-[10px] font-bold text-foreground">
                +18
              </div>
            </div>
            <span class="text-[10.5px] uppercase tracking-wider text-primary font-bold">20 MUSICIANS</span>
          </div>
          <div class="w-3 h-3 rounded-full bg-primary mt-2 shadow-sm border-2 border-white relative z-0">
          </div>
        </div>
        <!-- Greenpoint Area Pin (Live) -->
        <div class="absolute top-[45%] right-[20%] transform translate-x-1/2 flex flex-col items-center">
          <div class="bg-white rounded-[16px] border border-border p-3 shadow-sm flex flex-col items-center gap-2 relative z-10 w-[120px]">
            <span class="font-serif font-semibold text-foreground text-[15px]">Greenpoint</span>
            <div class="px-2.5 py-1 bg-accent/10 rounded-full flex items-center gap-1.5">
              <div class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse">
              </div>
              <span class="text-[11px] font-semibold text-accent-foreground">1 Jam Live</span>
            </div>
            <span class="text-[10.5px] uppercase tracking-wider text-primary font-bold">9 MUSICIANS</span>
          </div>
          <div class="w-3 h-3 rounded-full bg-accent mt-2 shadow-sm border-2 border-white relative z-0 halo-animation">
          </div>
        </div>
        <!-- Bushwick Area Pin -->
        <div class="absolute bottom-[25%] left-[30%] transform -translate-x-1/2 flex flex-col items-center">
          <div class="bg-white rounded-[16px] border border-border p-3 shadow-sm flex flex-col items-center gap-1.5 relative z-10 w-[120px]">
            <span class="font-serif font-semibold text-foreground text-[15px]">Bushwick</span>
                    <span class="text-[10.5px] uppercase tracking-wider text-primary font-bold mt-1">14 MUSICIANS</span>
          </div>
          <div class="w-3 h-3 rounded-full bg-primary mt-2 shadow-sm border-2 border-white relative z-0">
          </div>
        </div>
        <!-- User Location (Me) -->
        <div class="absolute top-[60%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-20">
          <div class="bg-white rounded-full px-3 py-1 shadow-md border border-border mb-1">
            <span class="text-[12px] font-bold text-foreground">Me</span>
          </div>
          <div class="w-4 h-4 rounded-full bg-[#4A90E2] border-[3px] border-white shadow-sm">
          </div>
          <div class="w-12 h-12 rounded-full bg-[#4A90E2] opacity-10 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none mt-3.5">
          </div>
        </div>
        <!-- Floating Status Pill -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-20 w-max">
          <div class="bg-white/95 backdrop-blur-sm px-4 py-2 rounded-full shadow-md border border-border">
            <span class="text-[12px] font-medium text-foreground">20 musicians nearby <span class="text-muted-foreground mx-1">·</span> 0.6–1.4 miles away</span>
          </div>
        </div>
      </div>
      <!-- BOTTOM TAB BAR -->
      <nav id="bottom-tab-bar" class="w-full h-[76px] bg-white/96 backdrop-blur border-t border-border flex justify-between items-start px-2 pt-3 pb-safe z-30 shrink-0">
        <!-- Map (Active) -->
            <button class="flex-1 flex flex-col items-center gap-1 min-w-[64px]" aria-label="Map">
                <i class="text-[22px] text-primary"><i class="fa-regular fa-map"></i></i>
                <span class="text-[10.5px] font-semibold text-primary">MAP</span>
            </button>

            <!-- Discover -->
            <button class="flex-1 flex flex-col items-center gap-1 min-w-[64px]" aria-label="Discover">
                <i class="text-[22px] text-[#9C97A9]"><i class="fa-regular fa-compass"></i></i>
                <span class="text-[10.5px] font-medium text-[#9C97A9]">DISCOVER</span>
            </button>

            <!-- Jams -->
            <button class="flex-1 flex flex-col items-center gap-1 min-w-[64px]" aria-label="Jams">
                <i class="text-[22px] text-[#9C97A9]"><i class="fa-solid fa-guitar"></i></i>
                <span class="text-[10.5px] font-medium text-[#9C97A9]">JAMS</span>
            </button>

            <!-- Live -->
            <button class="flex-1 flex flex-col items-center gap-1 min-w-[64px] relative" aria-label="Live">
        <div class="relative">
          <i class="text-[22px] text-[#9C97A9]"><i class="fa-solid fa-tower-broadcast"></i></i>
          <div class="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-accent border border-white">
          </div>
        </div>
        <span class="text-[10.5px] font-medium text-[#9C97A9]">LIVE</span>
            </button>

            <!-- Me -->
            <button class="flex-1 flex flex-col items-center gap-1 min-w-[64px]" aria-label="Me">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" class="w-[22px] h-[22px] rounded-full border border-border object-cover grayscale opacity-70" alt="Me">
                <span class="text-[10.5px] font-medium text-[#9C97A9]">ME</span>
            </button>
      </nav>
    </main>
  </body>
</html>
