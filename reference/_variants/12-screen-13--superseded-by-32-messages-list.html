<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest"};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
      :root {
          --background: #f8f7fa;
          --foreground: #3d3c4f;
          --card: #ffffff;
          --card-foreground: #3d3c4f;
          --popover: #ffffff;
          --popover-foreground: #3d3c4f;
          --primary: #8a79ab;
          --primary-foreground: #f8f7fa;
          --secondary: #dfd9ec;
          --secondary-foreground: #3d3c4f;
          --muted: #dcd9e3;
          --muted-foreground: #6b6880;
          --accent: #e6a5b8;
          --accent-foreground: #4b2e36;
          --destructive: #d95c5c;
          --destructive-foreground: #f8f7fa;
          --border: #cec9d9;
          --input: #eae7f0;
          --ring: #8a79ab;
          --chart-1: #8a79ab;
          --chart-2: #e6a5b8;
          --chart-3: #77b8a1;
          --chart-4: #f0c88d;
          --chart-5: #a0bbe3;
          --sidebar: #f1eff5;
          --sidebar-foreground: #3d3c4f;
          --sidebar-primary: #8a79ab;
          --sidebar-primary-foreground: #f8f7fa;
          --sidebar-accent: #e6a5b8;
          --sidebar-accent-foreground: #4b2e36;
          --sidebar-border: #d7d2e0;
          --sidebar-ring: #8a79ab;
          --font-sans: Geist, sans-serif;
          --font-serif: "Lora", Georgia, serif;
          --font-mono: "Fira Code", "Courier New", monospace;
          --radius: 0.5rem;
          --shadow-x: 1px;
          --shadow-y: 2px;
          --shadow-blur: 5px;
          --shadow-spread: 1px;
          --shadow-opacity: 0.06;
          --shadow-color: hsl(0 0% 0%);
          --shadow-2xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-sm: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow-md: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 2px 4px 0px hsl(0 0% 0% / 0.06);
          --shadow-lg: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 4px 6px 0px hsl(0 0% 0% / 0.06);
          --shadow-xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 8px 10px 0px hsl(0 0% 0% / 0.06);
          --shadow-2xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.15);
          --tracking-normal: 0em;
          --spacing: 0.25rem;
}
    </style>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
  </head>
  <body class="bg-[#f8f7fa] text-[#3d3c4f] h-[100dvh] flex flex-col w-full max-w-md mx-auto relative shadow-2xl overflow-hidden m-0 p-0 font-sans">
    <!-- SUB-SCREEN HEADER -->
    <header id="header" class="h-[56px] flex items-center justify-between px-4 shrink-0 bg-[#f8f7fa] z-10 border-b border-[#e4dfee]">
      <button class="w-8 h-8 flex items-center justify-start text-[#3d3c4f]">
            <i><i class="fa-solid fa-chevron-left"></i></i>
        </button>
      <h1 class="font-serif font-bold text-[17px] text-[#3d3c4f] text-center flex-1">
        Messages
      </h1>
      <button class="w-9 h-9 flex items-center justify-center text-[#3d3c4f] border border-[#e4dfee] rounded-full bg-white shrink-0">
            <i><i class="fa-regular fa-pen-to-square"></i></i>
        </button>
    </header>
    <!-- MAIN CONTENT -->
    <main id="main" class="flex-1 overflow-y-auto hide-scrollbar pb-[90px]">
      <!-- Search -->
      <div class="px-4 py-3">
        <div class="relative bg-white rounded-full border border-[#e4dfee] h-[40px] flex items-center px-4">
          <i class="text-[#9c97a9] text-[14px]"><i class="fa-solid fa-magnifying-glass"></i></i>
                <input type="text" placeholder="Search jams and people" class="w-full bg-transparent border-none focus:outline-none focus:ring-0 ml-2 text-[14px] text-[#3d3c4f] placeholder-[#9c97a9]">
        </div>
      </div>
      <!-- Filter Chips -->
      <div class="px-4 pb-4 overflow-x-auto hide-scrollbar">
        <div class="flex gap-2 w-max">
          <button class="bg-[#8a79ab] text-white px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0">All</button>
                <button class="bg-white text-[#3d3c4f] border border-[#e4dfee] px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0">Jams</button>
                <button class="bg-white text-[#3d3c4f] border border-[#e4dfee] px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0">Requests</button>
                <button class="bg-white text-[#3d3c4f] border border-[#e4dfee] px-4 py-1.5 rounded-full text-[13px] font-medium shrink-0">Bands</button>
        </div>
      </div>
      <!-- Message List -->
      <div class="px-4 flex flex-col gap-3">
        <!-- Message 1 (Group) -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 flex gap-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)] relative">
          <!-- Group Avatar Pair -->
          <div class="relative w-12 h-12 shrink-0">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Marcus" class="w-8 h-8 rounded-full border-2 border-white object-cover absolute top-0 right-0 z-10">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" alt="Leo" class="w-8 h-8 rounded-full border-2 border-white object-cover absolute bottom-0 left-0">
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start mb-0.5">
              <h3 class="font-serif font-bold text-[15px] text-[#3d3c4f] truncate">
                Neo-Soul Session
              </h3>
              <span class="text-[12px] text-[#9c97a9] shrink-0 ml-2">4m</span>
            </div>
            <p class="text-[14px] text-[#3d3c4f] font-medium truncate mb-2">
              Leo: Bringing the Rhodes
            </p>
            <span class="inline-block bg-[#f8f7fa] border border-[#e4dfee] text-[#8a79ab] text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">NEO-SOUL SESSION · FRI</span>
          </div>
          <!-- Unread Dot -->
          <div class="absolute top-4 right-4 w-2.5 h-2.5 bg-[#8a79ab] rounded-full">
          </div>
        </div>
        <!-- Message 2 -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 flex gap-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)] relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Sarah Jenkins" class="w-12 h-12 rounded-full border-2 border-[#e4dfee] object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start mb-0.5">
              <h3 class="font-serif font-bold text-[15px] text-[#3d3c4f] truncate">
                Sarah Jenkins
              </h3>
              <span class="text-[12px] text-[#9c97a9] shrink-0 ml-2">1h</span>
            </div>
            <p class="text-[14px] text-[#9c97a9] truncate mb-2">
              Sounds good, see you Tuesday
            </p>
            <span class="inline-block bg-[#fff5f7] border border-[#fce7f3] text-[#e6a5b8] text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">JAM REQUEST</span>
          </div>
        </div>
        <!-- Message 3 -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 flex gap-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)] relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Marcus Chen" class="w-12 h-12 rounded-full border-2 border-[#e4dfee] object-cover shrink-0">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start mb-0.5">
              <h3 class="font-serif font-bold text-[15px] text-[#3d3c4f] truncate">
                Marcus Chen
              </h3>
              <span class="text-[12px] text-[#9c97a9] shrink-0 ml-2">Yesterday</span>
            </div>
            <p class="text-[14px] text-[#9c97a9] truncate mb-2">
              Thanks for the vouch!
            </p>
            <span class="inline-block bg-[#f8f7fa] border border-[#e4dfee] text-[#8a79ab] text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">NEO-SOUL SESSION · FRI</span>
          </div>
        </div>
        <!-- Message 4 -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 flex gap-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)] relative">
          <div class="w-12 h-12 rounded-full bg-[#3d3c4f] flex items-center justify-center shrink-0">
            <i class="text-white"><i class="fa-solid fa-microphone-lines"></i></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start mb-0.5">
              <h3 class="font-serif font-bold text-[15px] text-[#3d3c4f] truncate">
                The Attic
              </h3>
              <span class="text-[12px] text-[#9c97a9] shrink-0 ml-2">Tue</span>
            </div>
            <p class="text-[14px] text-[#9c97a9] truncate mb-2">
              Your room is confirmed for Sunday
            </p>
            <span class="inline-block bg-[#f3f2f5] border border-[#e4dfee] text-[#3d3c4f] text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full">VENUE</span>
          </div>
        </div>
      </div>
    </main>
    <!-- THE BOTTOM TAB BAR -->
    <nav id="bottom-nav" class="absolute bottom-0 left-0 w-full h-[76px] bg-white/96 backdrop-blur-md border-t border-[#e4dfee] flex justify-between items-center px-6 z-20 pb-4">
      <!-- Map -->
        <a href="#" class="flex flex-col items-center justify-center gap-1 min-w-[56px] text-[#9c97a9]">
            <i class="text-[22px]"><i class="fa-regular fa-map"></i></i>
            <span class="text-[10.5px] font-medium">MAP</span>
        </a>

        <!-- Discover -->
        <a href="#" class="flex flex-col items-center justify-center gap-1 min-w-[56px] text-[#9c97a9]">
            <i class="text-[22px]"><i class="fa-regular fa-compass"></i></i>
            <span class="text-[10.5px] font-medium">DISCOVER</span>
        </a>

        <!-- Jams (Active) -->
        <a href="#" class="flex flex-col items-center justify-center gap-1 min-w-[56px] text-[#8a79ab]">
            <i class="text-[22px]"><i class="fa-solid fa-guitar"></i></i>
            <span class="text-[10.5px] font-semibold">JAMS</span>
        </a>

        <!-- Live -->
        <a href="#" class="flex flex-col items-center justify-center gap-1 min-w-[56px] text-[#9c97a9] relative">
      <div class="relative">
        <i class="text-[22px]"><i class="fa-solid fa-tower-broadcast"></i></i>
      </div>
      <span class="text-[10.5px] font-medium">LIVE</span>
        </a>

        <!-- Me -->
        <a href="#" class="flex flex-col items-center justify-center gap-1 min-w-[56px] text-[#9c97a9]">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" alt="Me" class="w-[22px] h-[22px] rounded-full border border-[#9c97a9] object-cover opacity-80">
            <span class="text-[10.5px] font-medium">ME</span>
        </a>
    </nav>
  </body>
</html>
