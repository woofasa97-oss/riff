<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Create Jam Request - Riff 2
    </title>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest"};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

        body { font-family: var(--font-sans); background-color: var(--background); }
        h1, h2, h3, h4, h5, h6 { font-family: var(--font-serif); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <style>
      :root {
          --background: #EFEBF6;
          --foreground: #6B6880;
          --card: #FFFFFF;
          --card-foreground: #3D3C4F;
          --primary: #8A79AB;
          --primary-foreground: #FFFFFF;
          --secondary: #E6A5B8;
          --secondary-foreground: #3D3C4F;
          --muted: #EFEBF6;
          --muted-foreground: #6B6880;
          --accent: #E6A5B8;
          --accent-foreground: #3D3C4F;
          --destructive: #DC2626;
          --destructive-foreground: #FFFFFF;
          --border: #DFD9EC;
          --input: #DFD9EC;
          --ring: #8A79AB;
          --font-sans: Geist;
          --font-serif: Lora;
          --font-mono: JetBrains Mono, monospace;
          --radius: 1rem;
          --shadow: -2px 4px 12px 4px rgba(51,51,51,0.05);
}
    </style>
  </head>
  <body class="m-0 p-0 min-h-[100dvh] flex justify-center text-[var(--foreground)] relative">
    <!-- Background Context (Dimmed Discovery Feed) -->
    <div class="w-full max-w-md min-h-[100dvh] bg-[var(--background)] relative overflow-hidden flex flex-col">
      <!-- Mock Header -->
      <header class="w-full px-5 py-4 flex items-center justify-between bg-[var(--background)] border-b border-[var(--border)] opacity-40">
        <h1 class="font-serif text-2xl font-bold text-[var(--card-foreground)]">
          Discover
        </h1>
        <div class="flex gap-4">
          <i class="text-[var(--foreground)]"><i class="fa-solid fa-sliders"></i></i>
        </div>
      </header>
      <!-- Mock Content -->
      <div class="p-5 flex flex-col gap-6 opacity-40">
        <!-- Mock Musician Card -->
        <div class="bg-[var(--card)] rounded-[16px] border border-[var(--border)] overflow-hidden">
          <div class="h-[200px] bg-[var(--muted)] w-full">
          </div>
          <div class="p-4">
            <div class="h-6 w-3/4 bg-[var(--muted)] rounded mb-2">
            </div>
            <div class="h-4 w-1/2 bg-[var(--muted)] rounded">
            </div>
          </div>
        </div>
        <div class="bg-[var(--card)] rounded-[16px] border border-[var(--border)] overflow-hidden">
          <div class="h-[200px] bg-[var(--muted)] w-full">
          </div>
        </div>
      </div>
      <!-- Dim Overlay -->
      <div class="absolute inset-0 bg-[var(--card-foreground)]/60 z-30 transition-opacity">
      </div>
      <!-- Bottom Tab Bar (Dimmed) -->
      <nav class="absolute bottom-0 w-full bg-[var(--card)] border-t border-[var(--border)] flex justify-between px-6 py-3 pb-8 z-20 opacity-40">
        <div class="flex flex-col items-center gap-1 text-[var(--primary)]">
          <i class="text-xl"><i class="fa-solid fa-compass"></i></i>
                <span class="text-[10px] font-medium">Discover</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[var(--foreground)]">
          <i class="text-xl"><i class="fa-regular fa-comment"></i></i>
                <span class="text-[10px] font-medium">Messages</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[var(--foreground)]">
          <i class="text-xl"><i class="fa-solid fa-guitar"></i></i>
                <span class="text-[10px] font-medium">My Jams</span>
        </div>
        <div class="flex flex-col items-center gap-1 text-[var(--foreground)]">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Profile" class="w-6 h-6 rounded-full object-cover">
                <span class="text-[10px] font-medium">Profile</span>
        </div>
      </nav>
    </div>
    <!-- Request a Jam Bottom Sheet -->
    <div id="request-sheet" class="fixed bottom-0 w-full max-w-md bg-[var(--card)] rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.12)] z-40 flex flex-col max-h-[90dvh] transition-transform duration-300 transform translate-y-0">
      <!-- Grab Handle -->
      <div class="w-full flex justify-center pt-4 pb-2 shrink-0">
        <div class="w-12 h-1.5 bg-[var(--border)] rounded-full">
        </div>
      </div>
      <div class="px-5 pb-5 overflow-y-auto hide-scrollbar flex flex-col gap-6">
        <!-- Top Row: Musician Info -->
        <div class="flex items-center gap-4 pt-2">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Marcus Chen" class="w-16 h-16 rounded-full object-cover border-2 border-[var(--border)] shadow-sm">
          <div class="flex flex-col">
            <h2 class="font-serif font-bold text-xl text-[var(--card-foreground)]">
              Marcus Chen
            </h2>
            <span class="text-sm text-[var(--foreground)] mb-1">Drummer - Jazz / Fusion</span>
            <div class="flex items-center gap-1.5 bg-[#F8F7FA] border border-[var(--border)] rounded-full px-2 py-1 w-fit">
              <i class="text-[var(--primary)] text-[10px]"><i class="fa-solid fa-star"></i></i>
                        <span class="text-[10px] font-semibold text-[var(--primary)] uppercase tracking-wide">98% reliability</span>
            </div>
          </div>
        </div>
        <hr class="border-[var(--border)]">
        <!-- Pick a Vibe -->
        <section class="flex flex-col gap-3">
          <h3 class="text-[10px] font-bold text-[var(--primary)] uppercase tracking-wider">
            Pick a Vibe
          </h3>
          <div class="flex flex-wrap gap-2">
            <button class="px-4 py-2 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-medium shadow-sm transition-colors">
                        Casual Jam
                    </button>
                    <button class="px-4 py-2 rounded-full bg-[#F8F7FA] text-[var(--card-foreground)] border border-[var(--border)] text-sm font-medium transition-colors hover:bg-[var(--secondary)]">
                        Serious Project
                    </button>
                    <button class="px-4 py-2 rounded-full bg-[#F8F7FA] text-[var(--card-foreground)] border border-[var(--border)] text-sm font-medium transition-colors hover:bg-[var(--secondary)]">
                        Gigging
                    </button>
          </div>
        </section>
        <!-- Suggest a Time -->
        <section class="flex flex-col gap-3">
          <h3 class="text-[10px] font-bold text-[var(--primary)] uppercase tracking-wider">
            Suggest a Time
          </h3>
          <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
            <!-- Selected Time Card -->
                    <button class="min-w-[140px] flex flex-col items-start gap-2 p-3 rounded-[12px] bg-[#F8F7FA] border-2 border-[var(--primary)] relative shrink-0 transition-all text-left">
            <div class="absolute top-2 right-2 w-5 h-5 bg-[#2FBF71] rounded-full flex items-center justify-center shadow-sm">
              <i class="text-white text-[10px]"><i class="fa-solid fa-check"></i></i>
            </div>
            <span class="font-serif font-bold text-[var(--card-foreground)] leading-tight text-sm">Tue 12 Nov,<br>7:00 PM</span>
            <div class="flex items-center gap-1.5 mt-1">
              <div class="w-1.5 h-1.5 rounded-full bg-[#2FBF71]">
              </div>
              <span class="text-[11px] font-medium text-[var(--foreground)]">He is free</span>
            </div>
            </button>

                    <!-- Unselected Time Card 1 -->
                    <button class="min-w-[140px] flex flex-col items-start gap-2 p-3 rounded-[12px] bg-[#F8F7FA] border border-[var(--border)] relative shrink-0 transition-all hover:bg-[var(--secondary)] text-left">
                        <span class="font-serif font-bold text-[var(--card-foreground)] leading-tight text-sm">Thu 14 Nov,<br>8:00 PM</span>
            <div class="flex items-center gap-1.5 mt-1">
              <div class="w-1.5 h-1.5 rounded-full bg-[#2FBF71]">
              </div>
              <span class="text-[11px] font-medium text-[var(--foreground)]">He is free</span>
            </div>
            </button>

                    <!-- Unselected Time Card 2 -->
                    <button class="min-w-[140px] flex flex-col items-start gap-2 p-3 rounded-[12px] bg-[#F8F7FA] border border-[var(--border)] relative shrink-0 transition-all hover:bg-[var(--secondary)] text-left">
                        <span class="font-serif font-bold text-[var(--card-foreground)] leading-tight text-sm">Sun 17 Nov,<br>4:00 PM</span>
            <div class="flex items-center gap-1.5 mt-1">
              <div class="w-1.5 h-1.5 rounded-full bg-[#2FBF71]">
              </div>
              <span class="text-[11px] font-medium text-[var(--foreground)]">He is free</span>
            </div>
            </button>
          </div>
        </section>
        <!-- Where -->
        <section class="flex flex-col gap-3">
          <h3 class="text-[10px] font-bold text-[var(--primary)] uppercase tracking-wider">
            Where
          </h3>
          <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
            <button class="px-4 py-2 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-medium whitespace-nowrap shadow-sm transition-colors">
                        Sonic Basement
                    </button>
                    <button class="px-4 py-2 rounded-full bg-[#F8F7FA] text-[var(--card-foreground)] border border-[var(--border)] text-sm font-medium whitespace-nowrap transition-colors hover:bg-[var(--secondary)]">
                        The Attic
                    </button>
                    <button class="px-4 py-2 rounded-full bg-[var(--muted)] text-[var(--card-foreground)] border border-dashed border-[var(--primary)] text-sm font-medium whitespace-nowrap flex items-center gap-2 transition-colors">
                        <i class="text-[10px]"><i class="fa-solid fa-plus"></i></i> Suggest a place
                    </button>
          </div>
        </section>
        <!-- Message Field -->
        <section class="flex flex-col gap-2">
          <textarea class="w-full bg-[#F8F7FA] rounded-[12px] border border-[var(--border)] p-4 text-sm text-[var(--card-foreground)] placeholder-[var(--foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent resize-none h-24 transition-shadow" placeholder="Say hi and what you want to play">
          </textarea>
        </section>
        <!-- Reassurance & Submit -->
        <div class="flex flex-col gap-4 mt-2 mb-4 shrink-0">
          <div class="flex items-center justify-center gap-2 bg-[var(--muted)] rounded-lg py-2.5 px-4 border border-[var(--border)]">
            <i class="text-[var(--primary)] text-xs"><i class="fa-solid fa-shield-halved"></i></i>
                    <span class="text-xs font-medium text-[var(--card-foreground)]">Nothing is confirmed until Marcus accepts.</span>
          </div>
          <button class="w-full py-4 rounded-[12px] bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold text-base shadow-md transition-transform hover:scale-[0.98] active:scale-95 flex items-center justify-center gap-2">
                    Send jam request
                </button>
        </div>
      </div>
    </div>
  </body>
</html>
