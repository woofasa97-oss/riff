<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Jams
    </title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      :root {
          --background: #f8f7fa;
          --foreground: #3d3c4f;
          --card: #ffffff;
          --card-foreground: #3d3c4f;
          --popover: #ffffff;
          --popover-foreground: #3d3c4f;
          --primary: #8a79ab;
          --primary-foreground: #f8f7fa;
          --secondary: #dfd9ec;
          --secondary-foreground: #3d3c4f;
          --muted: #dcd9e3;
          --muted-foreground: #6b6880;
          --accent: #e6a5b8;
          --accent-foreground: #4b2e36;
          --destructive: #d95c5c;
          --destructive-foreground: #f8f7fa;
          --border: #cec9d9;
          --input: #eae7f0;
          --ring: #8a79ab;
          --chart-1: #8a79ab;
          --chart-2: #e6a5b8;
          --chart-3: #77b8a1;
          --chart-4: #f0c88d;
          --chart-5: #a0bbe3;
          --sidebar: #f1eff5;
          --sidebar-foreground: #3d3c4f;
          --sidebar-primary: #8a79ab;
          --sidebar-primary-foreground: #f8f7fa;
          --sidebar-accent: #e6a5b8;
          --sidebar-accent-foreground: #4b2e36;
          --sidebar-border: #d7d2e0;
          --sidebar-ring: #8a79ab;
          --font-sans: Geist, sans-serif;
          --font-serif: "Lora", Georgia, serif;
          --font-mono: "Fira Code", "Courier New", monospace;
          --radius: 0.5rem;
          --shadow-x: 1px;
          --shadow-y: 2px;
          --shadow-blur: 5px;
          --shadow-spread: 1px;
          --shadow-opacity: 0.06;
          --shadow-color: hsl(0 0% 0%);
          --shadow-2xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-xs: 1px 2px 5px 1px hsl(0 0% 0% / 0.03);
          --shadow-sm: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 1px 2px 0px hsl(0 0% 0% / 0.06);
          --shadow-md: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 2px 4px 0px hsl(0 0% 0% / 0.06);
          --shadow-lg: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 4px 6px 0px hsl(0 0% 0% / 0.06);
          --shadow-xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.06), 1px 8px 10px 0px hsl(0 0% 0% / 0.06);
          --shadow-2xl: 1px 2px 5px 1px hsl(0 0% 0% / 0.15);
          --tracking-normal: 0em;
          --spacing: 0.25rem;
}
    </style>
  </head>
  <body class="bg-[#f8f7fa] text-[#3d3c4f] h-[100dvh] flex flex-col w-full max-w-md mx-auto relative shadow-2xl overflow-hidden">
    <!-- HEADER -->
    <header class="h-[56px] flex items-center justify-between px-4 shrink-0 bg-[#f8f7fa] z-10">
      <div class="font-serif font-bold text-[22px] text-[#8a79ab]">
        Riff
      </div>
      <div class="flex gap-2">
        <button class="w-[36px] h-[36px] rounded-full bg-white border border-[#e4dfee] flex items-center justify-center text-[#3d3c4f]">
                <i class="text-sm"><i class="fa-solid fa-sliders"></i></i>
            </button>
      </div>
    </header>
    <!-- TABS (Upcoming / Requests / Past) -->
    <div class="px-4 flex gap-6 border-b border-[#e4dfee] shrink-0 bg-[#f8f7fa]">
      <button class="pb-3 pt-2 text-[15px] font-semibold text-[#8a79ab] border-b-2 border-[#8a79ab]">
            Upcoming
        </button>
        <button class="pb-3 pt-2 text-[15px] font-medium text-[#9c97a9] flex items-center gap-1.5">
            Requests
            <span class="bg-[#8a79ab] text-white text-[10px] font-bold rounded-full w-[16px] h-[16px] flex items-center justify-center">2</span>
        </button>
        <button class="pb-3 pt-2 text-[15px] font-medium text-[#9c97a9]">
            Past
        </button>
    </div>
    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto px-4 py-6 hide-scrollbar pb-24">
      <!-- SECTION: THIS WEEK -->
      <div class="mb-6">
        <h2 class="text-[10.5px] font-bold uppercase tracking-wider text-[#8a79ab] mb-3">
          This Week
        </h2>
        <!-- Hero Card -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] overflow-hidden shadow-[0_4px_6px_-1px_rgba(0,0,0,0.05)] mb-4">
          <!-- Top Gradient Area -->
          <div class="bg-gradient-to-br from-[#f3f0f8] to-[#fceef2] p-4 relative">
            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-full text-[11px] font-semibold text-[#3d3c4f]">
              In 2 days
            </div>
            <h3 class="font-serif font-bold text-[20px] text-[#3d3c4f] mb-1 pr-16 leading-tight">
              Neo-Soul Session
            </h3>
            <div class="text-[14px] font-medium text-[#8a79ab] mb-3">
              Friday, 7:00 PM
            </div>
            <div class="flex items-center text-[13px] text-[#3d3c4f] mb-4">
              <i class="text-[#9c97a9] w-4 mr-1"><i class="fa-solid fa-location-dot"></i></i>
                        Sonic Basement, Greenpoint
            </div>
            <div class="flex items-center">
              <div class="flex -space-x-2">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Marcus" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Sarah" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" alt="Leo" class="w-8 h-8 rounded-full border-2 border-white object-cover">
              </div>
              <div class="ml-2 w-8 h-8 rounded-full bg-white border-2 border-white flex items-center justify-center text-[12px] font-medium text-[#8a79ab]">
                +1
              </div>
            </div>
          </div>
          <!-- Bottom Action Area -->
          <div class="p-4 flex gap-3">
            <button class="flex-1 h-[44px] rounded-[12px] bg-[#efebf6] text-[#3d3c4f] font-medium text-[14px] flex items-center justify-center">
                        Message group
                    </button>
                    <button class="flex-1 h-[44px] rounded-[12px] bg-white border border-[#e4dfee] text-[#3d3c4f] font-medium text-[14px] flex items-center justify-center">
                        Directions
                    </button>
          </div>
        </div>
        <!-- Standard Card -->
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)]">
          <div class="flex justify-between items-start mb-3">
            <div>
              <h3 class="font-serif font-bold text-[17px] text-[#3d3c4f] mb-1">
                Late Night Fusion
              </h3>
              <div class="text-[13px] text-[#9c97a9]">
                The Attic · Sun 17 Nov, 4:00 PM
              </div>
            </div>
          </div>
          <div class="flex items-center justify-between mt-4">
            <div class="flex -space-x-2">
              <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" alt="User" class="w-7 h-7 rounded-full border-2 border-white object-cover">
                        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="User" class="w-7 h-7 rounded-full border-2 border-white object-cover">
            </div>
            <div class="flex items-center gap-1.5 bg-[#f8f7fa] px-2.5 py-1 rounded-full text-[12px] text-[#9c97a9]">
              <i class="text-[10px]"><i class="fa-regular fa-clock"></i></i>
                        Awaiting 1 reply
            </div>
          </div>
        </div>
      </div>
      <!-- SECTION: OPEN CALLS -->
      <div class="mb-6">
        <h2 class="text-[10.5px] font-bold uppercase tracking-wider text-[#8a79ab] mb-3">
          Open Calls You Applied To
        </h2>
        <div class="bg-white rounded-[16px] border border-[#e4dfee] p-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.03)]">
          <h3 class="font-serif font-bold text-[16px] text-[#3d3c4f] mb-2 leading-tight">
            Looking for Keys for a Neo-Soul Session
          </h3>
          <div class="flex items-center justify-between mt-3">
            <div class="text-[13px] text-[#9c97a9]">
              Applied 2h ago
            </div>
            <div class="bg-[#fef9c3] text-[#ca8a04] px-2.5 py-1 rounded-full text-[12px] font-medium">
              Pending
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- BOTTOM TAB BAR -->
    <nav class="h-[76px] bg-white/96 backdrop-blur-md border-t border-[#e4dfee] absolute bottom-0 left-0 w-full flex items-center justify-around pb-2 z-20">
      <!-- Map -->
        <a href="#" class="flex flex-col items-center justify-center w-16 text-[#9c97a9]">
            <i class="text-[22px] mb-1"><i class="fa-regular fa-map"></i></i>
            <span class="text-[10.5px]">Map</span>
        </a>
        <!-- Discover -->
        <a href="#" class="flex flex-col items-center justify-center w-16 text-[#9c97a9]">
            <i class="text-[22px] mb-1"><i class="fa-regular fa-compass"></i></i>
            <span class="text-[10.5px]">Discover</span>
        </a>
        <!-- Jams (Active) -->
        <a href="#" class="flex flex-col items-center justify-center w-16 text-[#8a79ab]">
            <i class="text-[22px] mb-1"><i class="fa-solid fa-guitar"></i></i>
            <span class="text-[10.5px] font-semibold">Jams</span>
        </a>
        <!-- Live -->
        <a href="#" class="flex flex-col items-center justify-center w-16 text-[#9c97a9] relative">
      <div class="relative mb-1">
        <i class="text-[22px]"><i class="fa-solid fa-tower-broadcast"></i></i>
        <div class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-[#e6a5b8] rounded-full border border-white">
        </div>
      </div>
      <span class="text-[10.5px]">Live</span>
        </a>
        <!-- Me -->
        <a href="#" class="flex flex-col items-center justify-center w-16 text-[#9c97a9]">
            <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Me" class="w-[22px] h-[22px] rounded-full mb-1 object-cover">
            <span class="text-[10.5px]">Me</span>
        </a>
    </nav>
  </body>
</html>
