<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest"};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Onboarding - Record Clip - Riff 2
    </title>
    <style>
      :root {
          --background: #EFEBF6;
          --foreground: #6B6880;
          --card: #FFFFFF;
          --card-foreground: #3D3C4F;
          --primary: #8A79AB;
          --primary-foreground: #FFFFFF;
          --secondary: #E6A5B8;
          --secondary-foreground: #3D3C4F;
          --muted: #EFEBF6;
          --muted-foreground: #6B6880;
          --accent: #E6A5B8;
          --accent-foreground: #3D3C4F;
          --destructive: #DC2626;
          --destructive-foreground: #FFFFFF;
          --border: #DFD9EC;
          --input: #DFD9EC;
          --ring: #8A79AB;
          --font-sans: Geist;
          --font-serif: Lora;
          --font-mono: JetBrains Mono, monospace;
          --radius: 1rem;
          --shadow: -2px 4px 12px 4px rgba(51,51,51,0.05);
}
    </style>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
  </head>
  <body class="bg-background min-h-[100dvh] flex justify-center m-0 p-0 font-sans">
    <!-- Mobile Device Container -->
    <div class="w-full max-w-md min-h-[100dvh] flex flex-col relative bg-background shadow-xl">
      <!-- Header -->
      <header id="header" class="w-full px-5 py-4 flex items-center justify-between bg-background z-10 sticky top-0">
        <button class="w-10 h-10 flex items-center justify-start text-muted-foreground hover:text-foreground transition-colors">
                <i class="text-lg"><i class="fa-solid fa-chevron-left"></i></i>
            </button>
        <div class="font-sans font-semibold text-sm text-muted-foreground">
          Step 4 of 4
        </div>
        <div class="w-10">
        </div>
        <!-- Spacer for centering -->
      </header>
      <!-- Progress Bar -->
      <div class="w-full h-1 bg-border w-full">
        <div class="h-full bg-primary w-[95%] rounded-r-full transition-all duration-300">
        </div>
      </div>
      <!-- Main Scrollable Content -->
      <main class="flex-1 px-6 pt-8 pb-32 overflow-y-auto flex flex-col gap-8">
        <!-- Page Title -->
        <div class="flex flex-col gap-2">
          <h1 class="font-serif text-3xl font-bold text-card-foreground">
            Let them hear you
          </h1>
          <p class="text-base text-muted-foreground">
            24 seconds is all it takes. Musicians with a clip get 3x more jam requests.
          </p>
        </div>
        <!-- Recorder Section -->
        <section id="section-recorder" class="flex flex-col gap-6 items-center w-full">
          <!-- Main Record Card -->
          <div class="w-full bg-card rounded-2xl border border-border shadow-soft p-8 flex flex-col items-center justify-center relative overflow-hidden h-72">
            <!-- Waveform Visualizer (Simulated) -->
            <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
              <svg width="100%" height="80" viewBox="0 0 300 80" preserveAspectRatio="none">
                            <path d="M0,40 Q10,10 20,40 T40,40 T60,20 T80,40 T100,60 T120,40 T140,10 T160,40 T180,70 T200,40 T220,20 T240,40 T260,60 T280,40 T300,40" fill="none" stroke="var(--primary)" stroke-width="3" opacity="0.6"></path>
                             <path d="M0,40 Q15,60 30,40 T60,40 T90,20 T120,40 T150,60 T180,40 T210,10 T240,40 T270,70 T300,40" fill="none" stroke="var(--primary)" stroke-width="2" opacity="0.4"></path>
                        </svg>
            </div>
            <!-- Timer -->
            <div class="font-serif text-3xl font-bold text-primary mb-6 z-10">
              0:18 <span class="text-muted-foreground/50 text-2xl">/ 0:24</span>
            </div>
            <!-- Record Button -->
                    <button class="relative group z-10">
            <div class="absolute inset-0 bg-primary/20 rounded-full scale-125 animate-pulse group-hover:scale-150 transition-transform duration-500">
            </div>
            <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center shadow-lg relative z-10 border-4 border-background transition-transform active:scale-95">
              <i class="text-primary-foreground text-2xl"><i class="fa-solid fa-stop"></i></i>
            </div>
            </button>
            <p class="text-xs font-semibold text-primary uppercase tracking-[0.1em] mt-6 z-10">
              Recording...
            </p>
          </div>
          <!-- Controls -->
          <div class="flex gap-4 w-full justify-center">
            <button class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-primary transition-colors">
            <div class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center border border-border">
              <i class="text-sm"><i class="fa-solid fa-rotate-left"></i></i>
            </div>
            <span class="text-xs font-medium">Re-record</span>
                    </button>
                    <button class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-primary transition-colors">
            <div class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center border border-border">
              <i class="text-sm"><i class="fa-solid fa-play"></i></i>
            </div>
            <span class="text-xs font-medium">Play back</span>
                    </button>
                    <button class="flex flex-col items-center gap-1.5 text-muted-foreground hover:text-primary transition-colors">
            <div class="w-12 h-12 rounded-full bg-secondary flex items-center justify-center border border-border">
              <i class="text-sm"><i class="fa-solid fa-scissors"></i></i>
            </div>
            <span class="text-xs font-medium">Trim</span>
                    </button>
          </div>
        </section>
        <!-- Info Card -->
        <section id="section-info">
          <div class="bg-secondary p-5 rounded-2xl flex gap-4 items-start border border-border shadow-soft">
            <div class="text-primary mt-0.5">
              <i><i class="fa-solid fa-lightbulb"></i></i>
            </div>
            <p class="text-sm text-card-foreground leading-relaxed">
              <span class="font-semibold block mb-1">Pick something loose.</span>
                        A groove, a riff, a few bars. Nobody is auditioning.
            </p>
          </div>
        </section>
      </main>
      <!-- Sticky Bottom Bar -->
      <div id="footer-actions" class="absolute bottom-0 left-0 w-full bg-background/95 backdrop-blur-md border-t border-border p-4 px-6 flex gap-3 z-20 pb-8 sm:pb-4">
        <button class="flex-1 py-3.5 rounded-xl bg-secondary text-secondary-foreground font-semibold text-sm transition-colors hover:bg-secondary/80 active:scale-95 border border-border">
                Skip for now
            </button>
            <button class="flex-[2] py-3.5 rounded-xl bg-primary text-primary-foreground font-semibold text-sm shadow-md transition-colors hover:bg-primary/90 active:scale-95">
                Save clip &amp; finish
            </button>
      </div>
    </div>
  </body>
</html>
