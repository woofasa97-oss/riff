<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      Leaderboard - Riff 2
    </title>
    <script>
      window.FontAwesomeConfig = { autoReplaceSvg: "nest"};
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "border": "var(--border)",
        "input": "var(--input)",
        "ring": "var(--ring)",
        "background": "var(--background)",
        "foreground": "var(--foreground)",
        "primary": { "DEFAULT": "var(--primary)", "foreground": "var(--primary-foreground)" },
        "secondary": { "DEFAULT": "var(--secondary)", "foreground": "var(--secondary-foreground)" },
        "destructive": { "DEFAULT": "var(--destructive)", "foreground": "var(--destructive-foreground)" },
        "muted": { "DEFAULT": "var(--muted)", "foreground": "var(--muted-foreground)" },
        "accent": { "DEFAULT": "var(--accent)", "foreground": "var(--accent-foreground)" },
        "popover": { "DEFAULT": "var(--popover)", "foreground": "var(--popover-foreground)" },
        "card": { "DEFAULT": "var(--card)", "foreground": "var(--card-foreground)" },
        "sidebar": {
          "DEFAULT": "var(--sidebar)", "foreground": "var(--sidebar-foreground)",
          "primary": "var(--sidebar-primary)", "primary-foreground": "var(--sidebar-primary-foreground)",
          "accent": "var(--sidebar-accent)", "accent-foreground": "var(--sidebar-accent-foreground)",
          "border": "var(--sidebar-border)", "ring": "var(--sidebar-ring)"
        },
        "chart": { "1": "var(--chart-1)", "2": "var(--chart-2)", "3": "var(--chart-3)", "4": "var(--chart-4)", "5": "var(--chart-5)" }
      },
      borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      fontFamily: { sans: ["var(--font-sans)"], serif: ["var(--font-serif)"], mono: ["var(--font-mono)"] },
      boxShadow: {
        "2xs": "var(--shadow-2xs)", xs: "var(--shadow-xs)", sm: "var(--shadow-sm)",
        DEFAULT: "var(--shadow)", md: "var(--shadow-md)", lg: "var(--shadow-lg)",
        xl: "var(--shadow-xl)", "2xl": "var(--shadow-2xl)"
      }
    }
  }
}
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

        body { font-family: var(--font-sans); background-color: var(--background); }
        h1, h2, h3, h4, h5, h6 { font-family: var(--font-serif); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <style>
      :root {
          --background: #EFEBF6;
          --foreground: #6B6880;
          --card: #FFFFFF;
          --card-foreground: #3D3C4F;
          --primary: #8A79AB;
          --primary-foreground: #FFFFFF;
          --secondary: #E6A5B8;
          --secondary-foreground: #3D3C4F;
          --muted: #EFEBF6;
          --muted-foreground: #6B6880;
          --accent: #E6A5B8;
          --accent-foreground: #3D3C4F;
          --destructive: #DC2626;
          --destructive-foreground: #FFFFFF;
          --border: #DFD9EC;
          --input: #DFD9EC;
          --ring: #8A79AB;
          --font-sans: Geist;
          --font-serif: Lora;
          --font-mono: JetBrains Mono, monospace;
          --radius: 1rem;
          --shadow: -2px 4px 12px 4px rgba(51,51,51,0.05);
}
    </style>
  </head>
  <body class="m-0 p-0 min-h-[100dvh] flex justify-center text-[var(--foreground)] relative">
    <div class="w-full max-w-md min-h-[100dvh] bg-[var(--background)] relative flex flex-col shadow-[0_0_40px_rgba(0,0,0,0.05)]">
      <!-- Header -->
      <header class="w-full px-5 py-4 flex items-center justify-between bg-[var(--background)] sticky top-0 z-20 pt-8 pb-2">
        <button class="w-10 h-10 flex items-center justify-center rounded-full bg-[var(--card)] border border-[var(--border)] text-[var(--card-foreground)] shadow-sm transition-transform hover:scale-[0.98]">
                <i class="text-sm"><i class="fa-solid fa-chevron-left"></i></i>
            </button>
        <h1 class="font-serif font-bold text-xl text-[var(--card-foreground)]">
          Leaderboard
        </h1>
        <div class="w-10">
        </div>
        <!-- Spacer for centering -->
      </header>
      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto hide-scrollbar flex flex-col pb-40">
        <!-- Filters -->
        <div class="px-5 pt-2 pb-6 flex items-center justify-between">
          <div class="flex gap-2">
            <button class="px-4 py-2 rounded-full bg-[var(--card)] border border-[var(--border)] text-[var(--card-foreground)] text-sm font-semibold shadow-sm flex items-center gap-2">
                        Brooklyn <i class="text-xs opacity-60"><i class="fa-solid fa-chevron-down"></i></i>
                    </button>
                    <button class="px-4 py-2 rounded-full bg-[var(--card)] border border-[var(--border)] text-[var(--card-foreground)] text-sm font-semibold shadow-sm flex items-center gap-2">
                        Jazz Scene <i class="text-xs opacity-60"><i class="fa-solid fa-chevron-down"></i></i>
                    </button>
          </div>
          <div class="px-3 py-1.5 bg-[var(--card-foreground)] text-white text-[10px] font-bold uppercase tracking-wider rounded-full">
            Season 4
          </div>
        </div>
        <!-- Podium -->
        <div class="px-5 mb-8">
          <div class="w-full rounded-[24px] bg-gradient-to-br from-[var(--primary)] to-[var(--accent)] p-6 pt-10 pb-8 flex items-end justify-center gap-4 relative shadow-lg">
            <!-- 2nd Place -->
            <div class="flex flex-col items-center pb-2">
              <div class="relative w-14 h-14 mb-3">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-full h-full rounded-full object-cover border-2 border-white/40">
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-6 h-6 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white font-bold text-xs">
                  2
                </div>
              </div>
              <h4 class="font-serif font-bold text-white text-sm">
                Theo Park
              </h4>
              <p class="text-white/80 text-xs font-medium">
                9,420 pts
              </p>
            </div>
            <!-- 1st Place -->
            <div class="flex flex-col items-center z-10">
              <div class="absolute -top-3 text-[var(--accent)] drop-shadow-md">
                <i class="text-xl text-[#FACC15]"><i class="fa-solid fa-crown"></i></i>
              </div>
              <div class="relative w-20 h-20 mb-3 shadow-xl">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" class="w-full h-full rounded-full object-cover border-4 border-white">
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-8 h-8 bg-white text-[var(--primary)] rounded-full flex items-center justify-center font-bold text-sm shadow-md">
                  1
                </div>
              </div>
              <h4 class="font-serif font-bold text-white text-base">
                Nina Alvarez
              </h4>
              <p class="text-white/90 text-sm font-semibold">
                12,850 pts
              </p>
            </div>
            <!-- 3rd Place -->
            <div class="flex flex-col items-center pb-2">
              <div class="relative w-14 h-14 mb-3">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-6.jpg" class="w-full h-full rounded-full object-cover border-2 border-white/40">
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-6 h-6 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white font-bold text-xs">
                  3
                </div>
              </div>
              <h4 class="font-serif font-bold text-white text-sm">
                Ruby Sims
              </h4>
              <p class="text-white/80 text-xs font-medium">
                8,900 pts
              </p>
            </div>
          </div>
        </div>
        <!-- List -->
        <div class="flex flex-col gap-2 px-5">
          <!-- Rank 4 -->
          <div class="bg-[var(--card)] rounded-[16px] border border-[var(--border)] shadow-sm p-3 flex items-center gap-4">
            <span class="font-serif font-bold text-lg text-[var(--foreground)] w-6 text-center">4</span>
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1 min-w-0">
              <h4 class="font-serif font-bold text-sm text-[var(--card-foreground)] truncate">
                David Chen
              </h4>
              <p class="text-xs text-[var(--foreground)] truncate">
                Bass
              </p>
            </div>
            <div class="px-2 py-0.5 rounded bg-[#2FBF71]/10 text-[#2FBF71] text-[10px] font-bold">
              +1
            </div>
            <div class="flex flex-col items-end w-16">
              <span class="font-bold text-sm text-[var(--card-foreground)]">8,420</span>
              <div class="w-full bg-[var(--border)] h-1.5 rounded-full mt-1 overflow-hidden">
                <div class="bg-[var(--primary)] h-full w-[65%] rounded-full">
                </div>
              </div>
            </div>
          </div>
          <!-- Rank 5 -->
          <div class="bg-[var(--card)] rounded-[16px] border border-[var(--border)] shadow-sm p-3 flex items-center gap-4">
            <span class="font-serif font-bold text-lg text-[var(--foreground)] w-6 text-center">5</span>
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1 min-w-0">
              <h4 class="font-serif font-bold text-sm text-[var(--card-foreground)] truncate">
                Sarah Jenkins
              </h4>
              <p class="text-xs text-[var(--foreground)] truncate">
                Bassist, Indie/Rock
              </p>
            </div>
            <div class="px-2 py-0.5 rounded bg-[#E5262F]/10 text-[#E5262F] text-[10px] font-bold">
              -2
            </div>
            <div class="flex flex-col items-end w-16">
              <span class="font-bold text-sm text-[var(--card-foreground)]">7,950</span>
              <div class="w-full bg-[var(--border)] h-1.5 rounded-full mt-1 overflow-hidden">
                <div class="bg-[var(--primary)] h-full w-[60%] rounded-full">
                </div>
              </div>
            </div>
          </div>
          <!-- Rank 6 -->
          <div class="bg-[var(--card)] rounded-[16px] border border-[var(--border)] shadow-sm p-3 flex items-center gap-4">
            <span class="font-serif font-bold text-lg text-[var(--foreground)] w-6 text-center">6</span>
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-8.jpg" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1 min-w-0">
              <h4 class="font-serif font-bold text-sm text-[var(--card-foreground)] truncate">
                Leo Rossi
              </h4>
              <p class="text-xs text-[var(--foreground)] truncate">
                Keys, Neo-Soul
              </p>
            </div>
            <div class="px-2 py-0.5 rounded bg-[var(--border)] text-[var(--foreground)] text-[10px] font-bold">
              -
            </div>
            <div class="flex flex-col items-end w-16">
              <span class="font-bold text-sm text-[var(--card-foreground)]">7,100</span>
              <div class="w-full bg-[var(--border)] h-1.5 rounded-full mt-1 overflow-hidden">
                <div class="bg-[var(--primary)] h-full w-[55%] rounded-full">
                </div>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-center py-2">
            <div class="flex flex-col gap-1">
              <div class="w-1 h-1 rounded-full bg-[var(--foreground)] opacity-30">
              </div>
              <div class="w-1 h-1 rounded-full bg-[var(--foreground)] opacity-30">
              </div>
              <div class="w-1 h-1 rounded-full bg-[var(--foreground)] opacity-30">
              </div>
            </div>
          </div>
          <!-- Current User Rank (Highlighted) -->
          <div class="bg-[var(--muted)] rounded-[16px] border border-[var(--primary)] shadow-sm p-3 flex items-center gap-4 relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-[var(--primary)]">
            </div>
            <span class="font-serif font-bold text-lg text-[var(--primary)] w-6 text-center pl-1">14</span>
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-10 h-10 rounded-full object-cover">
            <div class="flex-1 min-w-0 flex items-center gap-2">
              <h4 class="font-serif font-bold text-sm text-[var(--card-foreground)] truncate">
                Marcus Chen
              </h4>
              <span class="px-1.5 py-0.5 rounded bg-[var(--primary)] text-white text-[9px] font-bold uppercase">You</span>
            </div>
            <div class="px-2 py-0.5 rounded bg-[#2FBF71]/10 text-[#2FBF71] text-[10px] font-bold">
              +3
            </div>
            <div class="flex flex-col items-end w-16">
              <span class="font-bold text-sm text-[var(--card-foreground)]">4,280</span>
              <div class="w-full bg-[var(--border)] h-1.5 rounded-full mt-1 overflow-hidden">
                <div class="bg-[var(--primary)] h-full w-[35%] rounded-full">
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <!-- Sticky Summary Bar -->
      <div class="absolute bottom-[80px] w-full px-5 py-4 bg-[var(--card)] border-t border-[var(--border)] z-30 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
        <div class="flex flex-col items-center text-center">
          <p class="text-sm font-medium text-[var(--card-foreground)] mb-1">
            You are <span class="font-bold text-[var(--primary)]">40 points</span> from the top 10
          </p>
          <a href="#" class="text-[11px] font-bold text-[var(--primary)] uppercase tracking-wider hover:underline">How points work</a>
        </div>
      </div>
      <!-- Bottom Navigation -->
      <nav class="absolute bottom-0 w-full bg-[var(--card)] border-t border-[var(--border)] px-6 py-4 pb-8 z-40 flex justify-between items-center">
        <button class="flex flex-col items-center gap-1 text-[var(--foreground)] hover:text-[var(--primary)] transition-colors">
                <i class="text-xl"><i class="fa-solid fa-compass"></i></i>
            </button>
            <button class="flex flex-col items-center gap-1 text-[var(--foreground)] hover:text-[var(--primary)] transition-colors">
                <i class="text-xl"><i class="fa-solid fa-comment"></i></i>
            </button>
            <button class="flex flex-col items-center gap-1 text-[var(--foreground)] hover:text-[var(--primary)] transition-colors">
                <i class="text-xl"><i class="fa-solid fa-calendar-days"></i></i>
            </button>
            <button class="flex flex-col items-center gap-1 transition-transform hover:scale-105 border-2 border-[var(--primary)] rounded-full p-0.5">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" alt="Profile" class="w-6 h-6 rounded-full object-cover">
            </button>
      </nav>
    </div>
  </body>
</html>
